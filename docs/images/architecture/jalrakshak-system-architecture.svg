<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="100%" height="100%" style="background:#0b1120; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#0891b2" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Title -->
  <text x="500" y="42" fill="#38bdf8" font-size="20" font-weight="700" text-anchor="middle" letter-spacing="1.5">JALRAKSHAK END-TO-END SYSTEM PIPELINE</text>
  <text x="500" y="65" fill="#94a3b8" font-size="12" text-anchor="middle">Physics-Grounded 2D Hydrodynamic Modeling → Dynamic Spatial Coupling → Evacuation Window Engine</text>

  <!-- Node 1: HEC-RAS -->
  <g transform="translate(40, 100)" filter="url(#shadow)">
    <rect width="180" height="150" rx="10" fill="url(#grad1)" stroke="#38bdf8" stroke-width="1.5" />
    <rect width="180" height="32" rx="10" fill="url(#blueGrad)" />
    <text x="90" y="21" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle">1. HEC-RAS 2D SOLVER</text>
    <text x="15" y="58" fill="#e2e8f0" font-size="11" font-weight="600">• Shallow Water Eqns</text>
    <text x="15" y="78" fill="#94a3b8" font-size="10">• Unsteady 2D Grid</text>
    <text x="15" y="98" fill="#94a3b8" font-size="10">• Native HDF5 Output</text>
    <text x="15" y="118" fill="#94a3b8" font-size="10">• WSE / Velocity / Time</text>
    <text x="15" y="138" fill="#38bdf8" font-size="9" font-family="monospace">SHA-256 Verified</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <path d="M 220 175 L 260 175" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)" />
  <polygon points="260,175 252,170 252,180" fill="#38bdf8" />

  <!-- Node 2: Hydraulic Extraction -->
  <g transform="translate(270, 100)" filter="url(#shadow)">
    <rect width="190" height="150" rx="10" fill="url(#grad1)" stroke="#06b6d4" stroke-width="1.5" />
    <rect width="190" height="32" rx="10" fill="url(#cyanGrad)" />
    <text x="95" y="21" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle">2. SPATIAL COUPLING</text>
    <text x="15" y="58" fill="#e2e8f0" font-size="11" font-weight="600">• KD-Tree 150m Corridor</text>
    <text x="15" y="78" fill="#94a3b8" font-size="10">• ≤50m Edge Densification</text>
    <text x="15" y="98" fill="#94a3b8" font-size="10">• Arrival: d ≥ 0.30m</text>
    <text x="15" y="118" fill="#94a3b8" font-size="10">• Hazard: v ≥ 1.0 m/s</text>
    <text x="15" y="138" fill="#06b6d4" font-size="9" font-family="monospace">EPSG:32644 Projected</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <path d="M 460 175 L 500 175" stroke="#06b6d4" stroke-width="2" />
  <polygon points="500,175 492,170 492,180" fill="#06b6d4" />

  <!-- Node 3: EWE Engine -->
  <g transform="translate(510, 100)" filter="url(#shadow)">
    <rect width="210" height="150" rx="10" fill="url(#grad1)" stroke="#d97706" stroke-width="1.5" />
    <rect width="210" height="32" rx="10" fill="url(#amberGrad)" />
    <text x="105" y="21" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle">3. EVACUATION ENGINE (EWE)</text>
    <text x="15" y="58" fill="#fde68a" font-size="11" font-weight="600">D_i = A_i - T_i - B</text>
    <text x="15" y="78" fill="#94a3b8" font-size="10">• A_i: Flood arrival on edge</text>
    <text x="15" y="98" fill="#94a3b8" font-size="10">• T_i: Cumulative travel time</text>
    <text x="15" y="118" fill="#94a3b8" font-size="10">• B: Safety buffer margin</text>
    <text x="15" y="138" fill="#fbbf24" font-size="9" font-family="monospace">D_route = min_i(D_i)</text>
  </g>

  <!-- Arrow 3 -> 4 -->
  <path d="M 720 175 L 760 175" stroke="#d97706" stroke-width="2" />
  <polygon points="760,175 752,170 752,180" fill="#d97706" />

  <!-- Node 4: Decision UI -->
  <g transform="translate(770, 100)" filter="url(#shadow)">
    <rect width="190" height="150" rx="10" fill="url(#grad1)" stroke="#059669" stroke-width="1.5" />
    <rect width="190" height="32" rx="10" fill="url(#emeraldGrad)" />
    <text x="95" y="21" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle">4. OPERATOR DECISION</text>
    <text x="15" y="58" fill="#e2e8f0" font-size="11" font-weight="600">• LEAVE BY: T+XX:XX</text>
    <text x="15" y="78" fill="#94a3b8" font-size="10">• Limiting Segment ID</text>
    <text x="15" y="98" fill="#94a3b8" font-size="10">• Safe Alternate Routes</text>
    <text x="15" y="118" fill="#94a3b8" font-size="10">• 3D ArcGIS SceneView</text>
    <text x="15" y="138" fill="#34d399" font-size="9" font-family="monospace">Zero Speculation</text>
  </g>

  <!-- Bottom Details Bar -->
  <g transform="translate(40, 290)" filter="url(#shadow)">
    <rect width="920" height="150" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <text x="25" y="30" fill="#38bdf8" font-size="13" font-weight="700">SCENARIO-DYNAMIC DATA ISOLATION ARCHITECTURE</text>
    
    <rect x="25" y="45" width="260" height="85" rx="6" fill="#1e293b" stroke="#475569" />
    <text x="35" y="65" fill="#e2e8f0" font-size="11" font-weight="600">Scenario Manifest</text>
    <text x="35" y="82" fill="#94a3b8" font-size="10">• Declares road &amp; point artifacts</text>
    <text x="35" y="98" fill="#94a3b8" font-size="10">• Safe relative path containment</text>
    <text x="35" y="114" fill="#94a3b8" font-size="10">• Zero silent fallback to global GIS</text>

    <rect x="330" y="45" width="260" height="85" rx="6" fill="#1e293b" stroke="#475569" />
    <text x="340" y="65" fill="#e2e8f0" font-size="11" font-weight="600">Request-Scoped Context</text>
    <text x="340" y="82" fill="#94a3b8" font-size="10">• Immutable ScenarioContext</text>
    <text x="340" y="98" fill="#94a3b8" font-size="10">• Multi-scenario concurrency safe</text>
    <text x="340" y="114" fill="#94a3b8" font-size="10">• Zero cross-request contamination</text>

    <rect x="635" y="45" width="260" height="85" rx="6" fill="#1e293b" stroke="#475569" />
    <text x="645" y="65" fill="#e2e8f0" font-size="11" font-weight="600">Scientific Auditability</text>
    <text x="645" y="82" fill="#94a3b8" font-size="10">• Transparent assumption ledger</text>
    <text x="645" y="98" fill="#94a3b8" font-size="10">• Strict separation of facts &amp; fixtures</text>
    <text x="645" y="114" fill="#94a3b8" font-size="10">• Full SHA-256 provenance chain</text>
  </g>
</svg>
